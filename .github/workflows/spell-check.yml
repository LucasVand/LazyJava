name: spell-check

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  codespell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Spell-check
        run: |
          python3 -m venv /tmp/venv-codespell
          /tmp/venv-codespell/bin/pip install --quiet codespell
          /tmp/venv-codespell/bin/codespell --toml codespell.toml src tests