[package]
name = "lazy-java"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.5.60", features = ["derive"] }
colored = "3.1.1"
filetime = "0.2.27"
inquire = "0.9.3"
log = "0.4"
pathdiff = "0.2.3"
quick-xml = { version = "0.39.2", features = ["serialize"] }
regex = "1.10"
reqwest = { version = "0.13.3", features = ["blocking"] }
tokio = "1.50.0"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
env_logger = "0.11.10"
